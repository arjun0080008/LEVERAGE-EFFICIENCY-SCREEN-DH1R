# Backup driver for the refresh job. Needs no secrets.
#
# Vercel drops the "next hop" trigger that a chained function issues, but a hop started by an outside caller
# always runs. /api/health is public and re-triggers the job whenever it finds one idle with no live lease,
# so looping on /api/health from here drives a multi-hop backfill or catch-up to completion.
#
# Runs nightly as a safety net (GitHub schedules can be delayed by an hour or more, which is fine) and can be
# started by hand from the Actions tab. APP_URL defaults to the production alias; override with a repository
# variable or secret of the same name if the domain changes.
name: Drive refresh to completion
on:
  schedule:
    - cron: "40 23 * * 1-5"
    - cron: "10 10 * * 2-6"
  workflow_dispatch:
jobs:
  drive:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Poll /api/health until the job is done
        env:
          APP_URL: ${{ secrets.APP_URL || vars.APP_URL || 'https://leverage-efficiency-screen-dh-1-r-z.vercel.app' }}
        run: |
          idle=0
          for i in $(seq 1 900); do
            out=$(curl -sS --max-time 60 "$APP_URL/api/health") || { echo "call failed, retrying"; sleep 20; continue; }
            phase=$(echo "$out" | sed -n 's/.*"job":{[^}]*"phase":"\([a-z]*\)".*/\1/p')
            days=$(echo "$out" | sed -n 's/.*"daysFetched":"\([0-9/]*\)".*/\1/p')
            revived=$(echo "$out" | grep -o '"revived":true' || true)
            asof=$(echo "$out" | sed -n 's/.*"snapshot":{"asOf":"\([0-9-]*\)".*/\1/p')
            echo "$(date -u +%H:%M:%S) phase=${phase:-none} days=${days:-?} snapshot=${asof:-none} ${revived:+REVIVED}"
            case "$phase" in
              done|skipped) echo "job finished"; exit 0;;
              failed) echo "$out"; exit 1;;
              fetch|compute) idle=0;;
              *) idle=$((idle+1)); [ $idle -ge 6 ] && { echo "no active job; nothing to drive"; exit 0; };;
            esac
            sleep 20
          done
          echo "gave up after 5 hours"; exit 1
